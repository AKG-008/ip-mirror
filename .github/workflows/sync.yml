name: Sync IP List

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and Update IP List
        run: |
          node -e "
          const fs = require('fs');

          // 配置多个备用获取通道（包含公共代理与直连）
          const SOURCES = [
            'https://api.allorigins.win/raw?url=https://countrymerge.pages.dev/all.txt',
            'https://corsproxy.io/?https://countrymerge.pages.dev/all.txt',
            'https://raw.githubusercontent.com/xinyitang3/cfnb/main/all.txt',
            'https://countrymerge.pages.dev/all.txt'
          ];

          (async () => {
            let fetchedContent = '';

            for (const url of SOURCES) {
              console.log(\`正在尝试从数据通道拉取: \${url}...\`);
              try {
                const res = await fetch(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                    'Cache-Control': 'no-cache'
                  }
                });

                if (res.ok) {
                  const text = await res.text();
                  // 过滤空行、HTML 标签（防 5 秒盾等错误页面）
                  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0 && !l.includes('<html') && !l.includes('<!DOCTYPE'));
                  
                  console.log(\` -> HTTP 状态码: \${res.status}, 提取到有效数据行数: \${lines.length}\`);

                  if (lines.length > 500) {
                    fetchedContent = lines.join('\n');
                    console.log('✅ 成功通过该通道拉取到完整数据！');
                    break; // 只要任意一个通道拿到有效 IP，立即退出循环
                  } else {
                    console.log('⚠️ 提取行数不足 500 行（可能遭遇验证页拦截），尝试下一个通道...');
                  }
                } else {
                  console.log(\`❌ 通道返回异常状态码: \${res.status}\`);
                }
              } catch (err) {
                console.log(\`❌ 通道连接异常: \${err.message}\`);
              }
            }

            // 写入与熔断防护
            if (fetchedContent) {
              fs.writeFileSync('all.txt', fetchedContent);
              console.log('✅ 数据校验通过，已成功更新本地 all.txt！');
            } else {
              console.log('⚠️ 所有通道均未能绕过防护，保留仓库历史全量数据。');
            }
          })();
          "

          LINE_COUNT=$(wc -l < all.txt 2>/dev/null || echo 0)
          echo "=== 当前仓库 all.txt 最终有效行数: $LINE_COUNT ==="

          if [ "$LINE_COUNT" -le 10 ]; then
            echo "❌ 文件依然为空，终止执行！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt

          if git diff --staged --quiet; then
            echo "=== 数据无变化，跳过提交 ==="
          else
            echo "=== 检测到 IP 数据变更，正在提交新版本 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
