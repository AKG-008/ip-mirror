name: Sync IP List

on:
  schedule:
    # 每 6 小时自动同步一次
    - cron: '0 */1 * * *'
  workflow_dispatch: # 允许手动点按钮立即触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Latest all.txt
        run: |
          # GitHub 境外节点直接拉取源站
          curl -sSL https://countrymerge.pages.dev/all.txt -o all.txt

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')" && git push)
