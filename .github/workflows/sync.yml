name: Sync IP List

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch with Real Chromium Browser
        run: |
          cat << 'EOF' > fetch.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            console.log('正在启动 Chromium 浏览器...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            // 伪装标准桌面浏览器标头
            await page.setExtraHTTPHeaders({
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
            });

            console.log('正在请求目标页面...');
            const response = await page.goto('https://countrymerge.pages.dev/all.txt', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log('HTTP 状态码:', response.status());

            // 获取全部响应内容
            let textContent = await response.text();
            
            // 如果返回的是 HTML（例如 Cloudflare 拦截页），打印前 500 个字符进行诊断
            if (textContent.includes('<html') || textContent.includes('<!DOCTYPE html')) {
              console.log('⚠️ 警告：返回了 HTML 页面而不是纯文本文件！');
              console.log('页面内容片段:\n', textContent.substring(0, 500));
              
              // 尝试读取页面内的 innerText 文本
              textContent = await page.evaluate(() => document.body.innerText || '');
            }

            fs.writeFileSync('all.txt', textContent.trim());
            console.log('写入本地文件完成！');

            await browser.close();
          })();
          EOF

          node fetch.js

          LINE_COUNT=$(wc -l < all.txt)
          echo "=== 成功提取到行数: $LINE_COUNT ==="

          if [ "$LINE_COUNT" -le 10 ]; then
            echo "❌ 提取到的内容不足（可能被 Cloudflare 机房 IP 墙阻断），停止提交！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt

          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
