name: Sync IP Mirror

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create Fetch Script
        run: |
          cat << 'EOF' > fetch.js
          const fs = require('fs');
          const path = require('path');

          const TARGET_URL = process.env.TARGET_URL;

          async function run() {
            console.log('正在请求目标 IP 文本...');

            try {
              const response = await fetch(TARGET_URL, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
                }
              });

              console.log(`HTTP 状态码: ${response.status}`);
              if (!response.ok) {
                throw new Error(`HTTP 请求失败，状态码: ${response.status}`);
              }

              const content = await response.text();

              // 校验抓取结果，防止空内容或严重截断覆盖原文件
              const lines = content.split('\n').filter(line => line.trim() !== '').length;
              if (lines < 100) {
                throw new Error(`提取行数异常（仅 ${lines} 行），放弃写入以防止污染数据！`);
              }

              const outputPath = path.join(__dirname, 'all.txt');
              fs.writeFileSync(outputPath, content, 'utf-8');
              console.log('写入本地文件完成！');
              console.log(`=== 成功提取到行数: ${lines} ===`);

            } catch (err) {
              console.error('抓取失败:', err.message);
              process.exit(1);
            }
          }

          run();
          EOF

      - name: Run Fetch Script
        env:
          TARGET_URL: 'https://countrymerge.pages.dev/all.txt'
        run: node fetch.js

      - name: Commit and Push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add all.txt
          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
