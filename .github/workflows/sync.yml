name: Sync IP List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Latest all.txt
        run: |
          echo "=== 开始拉取 countrymerge.pages.dev/all.txt ==="
          
          # 使用 corsproxy/allorigins 等代理 API 中转拉取
          URLS=(
            "https://corsproxy.io/?https://countrymerge.pages.dev/all.txt"
            "https://api.allorigins.win/raw?url=https://countrymerge.pages.dev/all.txt"
            "https://countrymerge.pages.dev/all.txt"
          )

          for target in "${URLS[@]}"; do
            echo "正在尝试: $target"
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$target" -o all.txt
            
            LINE_COUNT=$(wc -l < all.txt)
            echo "成功获取行数: $LINE_COUNT"
            
            if [ "$LINE_COUNT" -gt 100 ]; then
              echo "✅ 成功拉取到 $LINE_COUNT 行数据！"
              break
            fi
          done

          LINE_COUNT=$(wc -l < all.txt)
          if [ "$LINE_COUNT" -le 100 ]; then
            echo "❌ 拉取失败，获取内容不足！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt
          
          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
