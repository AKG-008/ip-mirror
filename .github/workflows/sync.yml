name: Sync IP Mirror

on:
  schedule:
    # 每 6 小时自动运行一次 (可根据需要调整)
    - cron: '0 */1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 如果选用 方案A (Axios)，只需 npm install axios
      # 如果选用 方案B (Playwright)，取消下方 playwright 相关注释
      - name: Install Dependencies
        run: |
          npm install axios
          # 如果使用 Playwright，请解开下面两行的注释：
          # npm install playwright
          # npx playwright install --with-deps chromium

      - name: Run Fetch Script
        env:
          TARGET_URL: 'https://你的目标IP源地址.com' # 替换为实际目标 URL
        run: node fetch.js

      - name: Commit and Push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add all.txt
          # 检查是否有文件改动，只有在 all.txt 发生变化时才提交
          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
