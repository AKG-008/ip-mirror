name: Sync IP List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch with Real Chromium Browser
        run: |
          cat << 'EOF' > fetch.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            console.log('正在启动 Chromium 浏览器...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            console.log('正在请求目标页面...');
            const response = await page.goto('https://countrymerge.pages.dev/all.txt', {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            // 直接获取 HTTP 响应体文本，完美兼容 .txt 纯文本文件
            const textContent = await response.text();

            fs.writeFileSync('all.txt', textContent.trim());
            console.log('文件成功写入！');

            await browser.close();
          })();
          EOF

          node fetch.js

          LINE_COUNT=$(wc -l < all.txt)
          echo "=== 成功提取到行数: $LINE_COUNT ==="

          if [ "$LINE_COUNT" -le 100 ]; then
            echo "❌ 提取到的内容不足，停止提交！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt

          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
