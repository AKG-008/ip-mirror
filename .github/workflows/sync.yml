name: Sync IP List

on:
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小时自动同步一次
  workflow_dispatch:        # 支持手动一键触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and Update IP List
        run: |
          node -e "
          const fs = require('fs');

          // 配置目标源列表（支持多源备用）
          const TARGET_URLS = [
            'https://countrymerge.pages.dev/all.txt'
          ];

          (async () => {
            let fetchedContent = '';

            for (const url of TARGET_URLS) {
              console.log(\`正在尝试拉取数据: \${url}...\`);
              try {
                const res = await fetch(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                    'Cache-Control': 'no-cache'
                  }
                });

                if (res.ok) {
                  const text = await res.text();
                  // 过滤空行、回车以及可能误抓到的 HTML 异常页面
                  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0 && !l.includes('<html'));
                  
                  console.log(\` -> HTTP 状态码: \${res.status}, 提取到有效数据行数: \${lines.length}\`);

                  if (lines.length > 100) {
                    fetchedContent = lines.join('\n');
                    break; // 成功获取到足够的 IP 数据，退出循环
                  } else {
                    console.log('⚠️ 有效行数不足 100 行，跳过此源');
                  }
                } else {
                  console.log(\`❌ HTTP 请求返回异常状态码: \${res.status}\`);
                }
              } catch (err) {
                console.log(\`❌ 网络请求异常: \${err.message}\`);
              }
            }

            // 安全写入逻辑：只有拿到有效数据才覆盖，防止清空历史数据
            if (fetchedContent) {
              fs.writeFileSync('all.txt', fetchedContent);
              console.log('✅ 数据校验通过，已成功更新本地 all.txt！');
            } else {
              console.log('⚠️ 未能从任何数据源获取到有效 IP，保留仓库历史全量数据。');
            }
          })();
          "

          # 校验最终文件行数并打印状态
          LINE_COUNT=$(wc -l < all.txt 2>/dev/null || echo 0)
          echo "=== 当前仓库 all.txt 最终有效行数: $LINE_COUNT ==="

          if [ "$LINE_COUNT" -le 10 ]; then
            echo "❌ 文件依然为空或内容异常，终止执行！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt

          if git diff --staged --quiet; then
            echo "=== 数据无变化，跳过提交 ==="
          else
            echo "=== 检测到 IP 数据变更，正在提交新版本 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
