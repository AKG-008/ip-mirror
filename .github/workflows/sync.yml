name: Sync IP List

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and Update IP List
        run: |
          node -e "
          const fs = require('fs');

          // 使用高可用 CDN 镜像源及备用源（完美绕过 Cloudflare 对 GH 机房 IP 的拦截）
          const SOURCES = [
            'https://cdn.jsdelivr.net/gh/xinyitang3/cfnb@main/all.txt',
            'https://raw.gitmirror.com/xinyitang3/cfnb/main/all.txt',
            'https://fastly.jsdelivr.net/gh/xinyitang3/cfnb@main/all.txt'
          ];

          (async () => {
            let fetchedContent = '';

            for (const url of SOURCES) {
              console.log(\`正在尝试从 CDN 镜像拉取: \${url}...\`);
              try {
                const res = await fetch(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                    'Cache-Control': 'no-cache'
                  }
                });

                if (res.ok) {
                  const text = await res.text();
                  // 过滤空行与 HTML 标签
                  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0 && !l.includes('<html') && !l.includes('<!DOCTYPE'));
                  
                  console.log(\` -> HTTP 状态码: \${res.status}, 成功提取有效数据行数: \${lines.length}\`);

                  if (lines.length > 100) {
                    fetchedContent = lines.join('\n');
                    console.log('✅ 成功通过 CDN 通道拉取到完整数据！');
                    break; 
                  } else {
                    console.log('⚠️ 提取行数不足 100 行，尝试下一个镜像...');
                  }
                } else {
                  console.log(\`❌ 镜像返回异常状态码: \${res.status}\`);
                }
              } catch (err) {
                console.log(\`❌ 请求异常: \${err.message}\`);
              }
            }

            // 写入与安全熔断
            if (fetchedContent) {
              fs.writeFileSync('all.txt', fetchedContent);
              console.log('✅ 数据校验通过，已成功写入 all.txt！');
            } else {
              console.log('⚠️ 所有 CDN 镜像均未获取到有效数据，保留本地历史文件。');
            }
          })();
          "

          LINE_COUNT=$(wc -l < all.txt 2>/dev/null || echo 0)
          echo "=== 当前仓库 all.txt 最终有效行数: $LINE_COUNT ==="

          if [ "$LINE_COUNT" -le 10 ]; then
            echo "❌ 文件依然为空，终止执行！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt

          if git diff --staged --quiet; then
            echo "=== 数据无变化，跳过提交 ==="
          else
            echo "=== 检测到 IP 数据变更，正在提交新版本 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
