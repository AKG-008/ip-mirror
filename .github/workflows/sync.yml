name: Sync IP List

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Latest all.txt
        run: |
          echo "=== 尝试从 GitHub 上游仓库直接拉取 ==="
          
          # 多源备选：优先拉取 GitHub 仓库源文件
          SOURCES=(
            "https://raw.githubusercontent.com/countrymerge/countrymerge.github.io/main/all.txt"
            "https://raw.githubusercontent.com/countrymerge/countrymerge.github.io/master/all.txt"
            "https://cdn.jsdelivr.net/gh/countrymerge/countrymerge.github.io@main/all.txt"
            "https://countrymerge.pages.dev/all.txt"
          )

          for url in "${SOURCES[@]}"; do
            echo "正在尝试请求: $url"
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$url" -o all.txt
            LINE_COUNT=$(wc -l < all.txt)
            if [ "$LINE_COUNT" -gt 10 ]; then
              echo "✅ 成功从 $url 获取到数据，共 $LINE_COUNT 行！"
              break
            fi
          done

          LINE_COUNT=$(wc -l < all.txt)
          if [ "$LINE_COUNT" -le 10 ]; then
            echo "❌ 所有来源均拉取失败，请检查上游仓库路径！"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt
          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
