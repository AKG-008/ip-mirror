name: Sync IP Mirror

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # 自动缓存 node_modules / npm cache

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json', '**/fetch.js') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          npm ci || npm install
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            echo "=== 已命中使用 Playwright 浏览器缓存，跳过下载 ==="
          fi

      - name: Create Fetch Script
        run: |
          cat << 'EOF' > fetch.js
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const TARGET_URL = process.env.TARGET_URL;

          async function run() {
            console.log('正在启动 Chromium 浏览器...');
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
            });
            
            const page = await context.newPage();
            console.log('正在请求目标页面...');

            try {
              const response = await page.goto(TARGET_URL, { waitUntil: 'networkidle', timeout: 30000 });
              console.log(`HTTP 状态码: ${response.status()}`);

              const content = await page.evaluate(() => document.body.innerText);

              const outputPath = path.join(__dirname, 'all.txt');
              fs.writeFileSync(outputPath, content, 'utf-8');
              console.log('写入本地文件完成！');

              const lines = content.split('\n').filter(line => line.trim() !== '').length;
              console.log(`=== 成功提取到行数: ${lines} ===`);

            } catch (err) {
              console.error('抓取失败:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          }

          run();
          EOF

      - name: Run Fetch Script
        env:
          TARGET_URL: 'https://countrymerge.pages.dev/all.txt' # ⚠️ 替换为真实 IP 源地址
        run: node fetch.js

      - name: Commit and Push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add all.txt
          if git diff --staged --quiet; then
            echo "=== 内容无变化，跳过提交 ==="
          else
            echo "=== 检测到更新，开始提交并推送 ==="
            git commit -m "Auto update all.txt on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
